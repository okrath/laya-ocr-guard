[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "laya-ocr-guard"
version = "0.6.0"
description = "Dual-gate impact analysis & regression guard combining Laya, Alibaba Open Code Review (OCR), and LLM reasoning"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Orca Team", email = "admin@orca.local" }
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "numpy>=1.24.0",
    "onnxruntime>=1.16.0",
    "tokenizers>=0.15.0",
]

[project.optional-dependencies]
laya = [
    "laya>=0.3.0",
]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
guard = "guard.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["guard*"]

[tool.setuptools.package-data]
"guard" = ["assets/**/*"]
